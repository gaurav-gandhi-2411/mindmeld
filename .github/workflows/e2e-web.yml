name: E2E web (integration_test)

# This repo's GitHub plan tier has NO branch protection configured, so this
# workflow CANNOT be made a "required" check -- it runs and reports on every
# push/PR, but nothing currently blocks a merge on its failure. That is a
# known, documented gap, not an oversight.
#
# Wires integration_test/app_test.dart (full guess -> win loop for en/hi-en,
# a garbage-word rejection check, and a spoiler-safety assertion on the share
# card) into CI. It previously existed on disk but was never run anywhere
# (found by a /launch-check audit).
#
# Also wires integration_test/first_session_test.dart (first-session-hook
# wave): the onboarding-puzzle funnel end to end -- cold-profile EN and
# Hinglish onboarding -> win -> graduate to the live daily, an existing
# (legacy-onboarded) user never seeing onboarding, resume-not-strand across
# a simulated app restart, and the skip escape hatch.
#
# Why web, not the Android emulator the test file's own header comment
# mentions: mindmeld/Warmer is a WEB-ONLY product (production is
# playwarmer.vercel.app; there is no distributed native build). Spinning up
# Android emulator infra in CI for a platform with zero real users would be
# disproportionate effort for zero coverage of what's actually shipped.
# integration_test supports running on Flutter web via `flutter drive`
# against the `web-server` device driven by chromedriver over WebDriver --
# that is the path proven to work locally (see PR description / session
# notes for the exact command and passing output) and is what this workflow
# runs. `-d chrome` (direct DWDS debug connection) was tried first and does
# NOT work reliably here: DWDS's tab-matching step
# (dev_handler.dart _startLocalDebugService) throws AppConnectionException
# when Chrome is launched via chromedriver instead of directly by
# flutter_tools, regardless of compile warmth. `-d web-server
# --browser-name=chrome` sidesteps that entirely and is the officially
# documented way to drive integration_test on web.
#
# Known flakiness risk: app_test.dart makes a REAL network fetch against the
# live GitHub Pages payload host (gaurav-gandhi-2411.github.io/mindmeld-payloads)
# by design (see the test file's own docstring) -- this is intentional, not
# something to mock, but it does mean this job's result depends on that
# host's availability, same as uptime-check.yml.
#
# Expected runtime: ~3-5 minutes per `flutter drive` invocation (cold DDC
# compile of a Firebase-heavy app is the dominant cost, not the test body
# itself) -- two invocations now that first_session_test.dart is wired in
# too, so timeout-minutes below is sized for both sequentially, not one.

on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # ubuntu-latest ships Chrome but not a version-matched chromedriver;
      # this action detects the installed Chrome version and installs the
      # matching driver on PATH.
      - uses: nanasess/setup-chromedriver@v3

      - name: Start chromedriver
        run: |
          chromedriver --port=4444 &
          sleep 2
          curl -sf http://localhost:4444/status

      - name: Run integration_test/app_test.dart on Flutter web (Chrome via WebDriver)
        working-directory: app
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server \
            --browser-name=chrome \
            --web-port=7357

      # Separate `flutter drive` invocation (integration_test's single-target
      # driver doesn't support running multiple test files in one pass) --
      # sequential after the step above, same chromedriver server, a
      # different --web-port so nothing races the just-released 7357.
      - name: Run integration_test/first_session_test.dart on Flutter web (Chrome via WebDriver)
        working-directory: app
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/first_session_test.dart \
            -d web-server \
            --browser-name=chrome \
            --web-port=7358

  # WASM lane — the root fix for known-limitations entry 19. Production ships
  # `flutter build web --wasm`, where dart.library.html is FALSE: any
  # conditional import keyed on it silently compiles the no-op stub in
  # production while the DDC-compiled job above stays green (this is exactly
  # how ?reset=1, /join links, share, and the SQLite storage backend were all
  # dead/stubbed on live between 2026-07-12 and 2026-07-17). This job runs the
  # SAME integration suite against a dart2wasm compile, plus a storage-backend
  # probe against the real production build artifact, so a dart:html-era stub
  # can never again pass CI while breaking production.
  e2e-web-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - uses: nanasess/setup-chromedriver@v3

      - name: Start chromedriver
        run: |
          chromedriver --port=4444 &
          sleep 2
          curl -sf http://localhost:4444/status

      - name: Run integration_test/app_test.dart on WASM (Chrome via WebDriver)
        working-directory: app
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server \
            --browser-name=chrome \
            --web-port=7359 \
            --wasm

      - name: Run integration_test/first_session_test.dart on WASM (Chrome via WebDriver)
        working-directory: app
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/first_session_test.dart \
            -d web-server \
            --browser-name=chrome \
            --web-port=7360 \
            --wasm

      # Storage-backend probe against the real production artifact: builds
      # web --wasm exactly as deploy-warmer.ps1 does and asserts the
      # SQLite/WASM backend actually initialises (console signal + IndexedDB
      # database present + persistence across reload) — NOT the PrefsStore
      # fallback. See firebase-tests/wasm_storage_check.js.
      - name: Build production wasm artifact
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn --wasm

      - name: npm ci (puppeteer harness)
        working-directory: firebase-tests
        run: npm ci

      - name: WASM storage-backend probe
        # python3 (preinstalled) instead of npx serve: a cold `npx --yes serve`
        # downloads the package first, so a fixed sleep raced the server and
        # the probe hit ERR_CONNECTION_REFUSED. Readiness is polled, not slept.
        run: |
          python3 -m http.server 8321 --directory app/build/web &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8321/ && break
            sleep 1
          done
          CHROME_PATH="$(which google-chrome || which chromium-browser || which chromium)" \
            node firebase-tests/wasm_storage_check.js http://localhost:8321/
