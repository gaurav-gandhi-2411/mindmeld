name: Daily notification

# Phase 6b scheduled sender (spec-phase6b.md "Scheduled sender (GitHub
# Actions)"): broadcasts the daily "puzzle is live" push via FCM topics.
# GitHub Actions cron instead of Cloud Functions is the whole point of the
# $0/no-Blaze-plan architecture decision -- see scripts/send_daily_notification.py's
# module docstring for the full rationale.

run-name: >-
  Daily notification${{ inputs.dry_run == true && ' (dry run)' || '' }}

on:
  schedule:
    # 03:00 UTC = 08:30 IST (spec: India-first, ~8:30am IST single-time send).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: query Firestore and build messages, but skip every mutating call"
        type: boolean
        default: false
      date:
        description: "Puzzle date YYYY-MM-DD to check (optional; default today in IST). Testing only."
        type: string
        required: false
        default: ""

concurrency:
  group: daily-notification
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Send daily FCM topic broadcast
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Via env, not inline interpolation: a free-text input must not be shell-injectable.
          PUZZLE_DATE: ${{ inputs.date }}
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$PUZZLE_DATE" ]; then args+=(--date "$PUZZLE_DATE"); fi
          uv run scripts/send_daily_notification.py "${args[@]}"
