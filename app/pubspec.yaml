name: mindmeld
description: "Warmer — Semantic Daily Word Game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  crypto: ^3.0.3
  sqflite: ^2.3.2
  sqflite_common: ^2.5.4
  sqflite_common_ffi_web: ^0.4.5+1
  archive: ^4.0.9
  web: ^1.1.0
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_mobile_ads: ^9.0.0
  purchases_flutter: ^10.2.3
  firebase_core: ^3.13.1
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.5
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/payloads/en/2026-06-12.json.gz
    - assets/payloads/en/2026-06-13.json.gz
    - assets/payloads/en/2026-06-14.json.gz
    - assets/payloads/en/2026-06-15.json.gz
    - assets/payloads/en/2026-06-16.json.gz
    - assets/payloads/en/2026-06-17.json.gz
    - assets/payloads/en/2026-06-18.json.gz
    - assets/payloads/hi-en/2026-06-12.json.gz
    - assets/payloads/hi-en/2026-06-13.json.gz
    - assets/payloads/hi-en/2026-06-14.json.gz
    - assets/payloads/hi-en/2026-06-15.json.gz
    - assets/payloads/hi-en/2026-06-16.json.gz
    - assets/payloads/hi-en/2026-06-17.json.gz
    - assets/payloads/hi-en/2026-06-18.json.gz
    - assets/payloads/packs/manifest.json

flutter_launcher_icons:
  # Generate adaptive icons for Android (API 26+).
  android: "launcher_icon"
  # Background: the heat-rings app-tile dark ground — solid fill so the icon
  # looks good on any adaptive-icon shape.
  adaptive_icon_background: "#171614"
  # Foreground: transparent rings-only mark (safe-zone padding baked in by
  # scripts/make_app_icon.py's ratios), composited over the background above.
  adaptive_icon_foreground: "assets/icon-1024-fg.png"
  # Also replace the legacy mipmap ic_launcher for API < 26 devices — uses the
  # opaque tile (dark ground baked in) since legacy/iOS icons must be full-bleed.
  image_path: "assets/icon-1024.png"
  min_sdk_android: 21
