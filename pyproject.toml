[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E402 fires when a module docstring precedes `from __future__ import annotations`
# and then regular imports follow. This is the correct Python pattern for scripts
# that need both a module docstring and future imports; suppressing globally to
# match generator/pyproject.toml's identical rationale for the same pattern.
ignore = ["E402"]
